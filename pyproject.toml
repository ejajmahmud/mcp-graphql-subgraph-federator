[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-graphql-subgraph-federator"
version = "0.1.0"
description = "On-the-fly GraphQL federation bridge compiling disparate enterprise GraphQL schemas into unified MCP tool interfaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-graphql-subgraph-federator = "mcp_graphql_subgraph_federator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_graphql_subgraph_federator*"]
